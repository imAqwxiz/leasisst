name: Build Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          target: Android64

      - name: Upload the mod
        uses: actions/upload-artifact@v4
        with:
          name: mod-android64
          path: build/*.geode
          if-no-files-found: error
